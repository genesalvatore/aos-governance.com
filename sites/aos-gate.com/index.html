        <h1>AOS Gate — Sovereign Control & Deterministic AI Governance</h1>
        <p><strong>AOS Gate</strong> is not an API wrapped in promises—it is a physical network bottleneck running locally within your infrastructure. The proxy sits <em>before</em> the outbound HTTP request ever leaves the server. If the payload fails a configured regex policy, the outbound request is instantly aborted. The upstream API is never called.</p>
        
        <h2>Core Features & Architectural Mechanics</h2>
        <ul>
          <li><strong>The Physical Bottleneck (It Blocks):</strong> Instantly aborts hostile egress before reaching upstream APIs. Returns strict 403 Forbidden on policy match.</li>
          <li><strong>Absolute Auditability (It Logs & Records):</strong> Burns immortal, line-delimited .jsonl files tracking precise native prompts, timestamps, PII, and model latency.</li>
          <li><strong>Instant Incident Analysis (It Highlights):</strong> Built-in Enterprise Dashboard running locally to visualize policy violations and PII triggers.</li>
          <li><strong>Seamless Implementation:</strong> Deploys in one line of Docker code as a transparent proxy, forwarding authorization headers untouched.</li>
        </ul>
        
        <h3>From Experimental to Institutional</h3>
        <p>By open-sourcing the Gate as an easy-to-deploy Docker image, we provide a turnkey solution for developers struggling with unpredictable, vibe-coded agents. AOS Gate shifts the paradigm from probabilistic guardrails to deterministic, audited enforcement—because that is the prerequisite for deploying autonomous AI in production environments.</p>
