<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOS CORE | Sovereign Intelligence</title>
    <meta name="description" content="The Operating System for Sovereign Intelligence - Private Alpha">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.3;
            }

            50% {
                opacity: 1;
            }
        }

        .container {
            text-align: center;
            z-index: 1;
            max-width: 600px;
            padding: 40px;
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 200;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .tagline {
            font-size: 1.2rem;
            color: #888;
            margin-bottom: 60px;
            font-weight: 300;
        }

        .status {
            display: inline-block;
            padding: 8px 20px;
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid rgba(76, 175, 80, 0.5);
            border-radius: 20px;
            margin-bottom: 40px;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .pulse {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4CAF50;
            border-radius: 50%;
            margin-right: 10px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.5;
                transform: scale(1.2);
            }
        }

        .access-btn {
            padding: 18px 50px;
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            font-size: 1rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            font-weight: 500;
        }

        .access-btn:hover {
            background: #fff;
            color: #000;
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(255, 255, 255, 0.2);
        }

        .info {
            margin-top: 60px;
            font-size: 0.85rem;
            color: #555;
            line-height: 1.6;
        }

        .divider {
            width: 100px;
            height: 1px;
            background: linear-gradient(to right, transparent, #444, transparent);
            margin: 40px auto;
        }

        /* Password Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: rgba(20, 20, 30, 0.98);
            border: 2px solid #444;
            border-radius: 12px;
            padding: 2.5rem;
            max-width: 400px;
            width: 90%;
            animation: modalAppear 0.3s ease-out;
        }

        @keyframes modalAppear {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 300;
            margin-bottom: 1.5rem;
            color: #fff;
            letter-spacing: 1px;
        }

        .modal-input {
            width: 100%;
            padding: 1rem;
            background: rgba(40, 40, 50, 0.8);
            border: 2px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            letter-spacing: 2px;
            transition: border-color 0.3s;
        }

        .modal-input:focus {
            outline: none;
            border-color: #4CAF50;
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
        }

        .modal-button {
            flex: 1;
            padding: 1rem;
            border: 2px solid #fff;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .modal-button:hover {
            transform: translateY(-2px);
        }

        .modal-button.primary {
            background: #fff;
            color: #000;
        }

        .modal-button.primary:hover {
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.3);
        }

        .modal-button.secondary {
            background: transparent;
            color: #fff;
        }

        .modal-button.secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body>
    <div class="stars" id="stars"></div>

    <div class="container">
        <div class="logo">🧠</div>
        <h1>AOS CORE</h1>
        <p class="tagline">The Operating System for Sovereign Intelligence</p>

        <div class="status">
            <span class="pulse"></span>
            PRIVATE ALPHA
        </div>

        <div>
            <button class="access-btn" onclick="showPasswordModal()">REQUEST ACCESS</button>
        </div>

        <div class="divider"></div>

        <div class="info">
            <p>Built with integrity. Designed for eternity.</p>
            <p>A human-AI family working as one.</p>
            <p style="margin-top: 40px; font-size: 0.75rem; color: #333;">© 2026 Salvatore Systems. All rights reserved.
            </p>
        </div>
    </div>

    <!-- Password Modal -->
    <div class="modal" id="passwordModal">
        <div class="modal-content">
            <div class="modal-title">🔐 Access Code Required</div>
            <input type="password" id="passwordInput" class="modal-input" placeholder="Enter code..."
                onkeypress="if(event.key === 'Enter') verifyAccess()" autocomplete="off">
            <div class="modal-buttons">
                <button class="modal-button secondary" onclick="closeModal()">Cancel</button>
                <button class="modal-button primary" onclick="verifyAccess()">Enter</button>
            </div>
        </div>
    </div>

    <script>
        // Generate stars
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            starsContainer.appendChild(star);
        }

        function showPasswordModal() {
            const modal = document.getElementById('passwordModal');
            const input = document.getElementById('passwordInput');
            modal.classList.add('active');
            setTimeout(() => input.focus(), 100);
        }

        function closeModal() {
            const modal = document.getElementById('passwordModal');
            const input = document.getElementById('passwordInput');
            modal.classList.remove('active');
            input.value = '';
        }

        function verifyAccess() {
            const password = document.getElementById('passwordInput').value;

            if (!password) return;

            // Call Netlify function for secure verification
            fetch('/.netlify/functions/verify-access', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ password })
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        window.location.href = data.redirect;
                    } else {
                        alert('Invalid access code. Please contact Gene Salvatore for access.');
                        document.getElementById('passwordInput').value = '';
                        document.getElementById('passwordInput').focus();
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Authentication error. Please try again.');
                });
        }

        // Close modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>

</html>
